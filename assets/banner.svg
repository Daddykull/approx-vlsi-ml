<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f1b33"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- circuit trace grid, right side -->
  <g stroke="#2b3a67" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 760 0 L 760 60 L 840 60 L 840 130"/>
    <path d="M 880 0 L 880 40 L 940 40 L 940 100 L 1010 100"/>
    <path d="M 1000 0 L 1000 30 L 1060 30"/>
    <path d="M 760 320 L 760 260 L 850 260 L 850 190"/>
    <path d="M 900 320 L 900 270 L 960 270 L 960 210"/>
    <path d="M 1040 320 L 1040 280 L 1100 280"/>
    <path d="M 1150 60 L 1110 60 L 1110 140"/>
    <path d="M 1160 220 L 1120 220 L 1120 160"/>
  </g>
  <g fill="#22d3ee" opacity="0.8">
    <circle cx="840" cy="130" r="4"/>
    <circle cx="1010" cy="100" r="4"/>
    <circle cx="850" cy="190" r="4"/>
    <circle cx="960" cy="210" r="4"/>
    <circle cx="1110" cy="140" r="4"/>
    <circle cx="1120" cy="160" r="4"/>
  </g>

  <!-- chip icon -->
  <g transform="translate(850,130)" filter="url(#glow)">
    <rect x="0" y="0" width="150" height="100" rx="10" fill="#0b1220" stroke="url(#accent)" stroke-width="3"/>
    <g stroke="url(#accent)" stroke-width="3">
      <line x1="20" y1="0" x2="20" y2="-16"/>
      <line x1="60" y1="0" x2="60" y2="-16"/>
      <line x1="100" y1="0" x2="100" y2="-16"/>
      <line x1="130" y1="0" x2="130" y2="-16"/>
      <line x1="20" y1="100" x2="20" y2="116"/>
      <line x1="60" y1="100" x2="60" y2="116"/>
      <line x1="100" y1="100" x2="100" y2="116"/>
      <line x1="130" y1="100" x2="130" y2="116"/>
      <line x1="0" y1="25" x2="-16" y2="25"/>
      <line x1="0" y1="50" x2="-16" y2="50"/>
      <line x1="0" y1="75" x2="-16" y2="75"/>
      <line x1="150" y1="25" x2="166" y2="25"/>
      <line x1="150" y1="50" x2="166" y2="50"/>
      <line x1="150" y1="75" x2="166" y2="75"/>
    </g>
    <text x="75" y="48" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">A ≈ B</text>
    <text x="75" y="72" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="2">16-BIT ADDER</text>
  </g>

  <!-- accent rule -->
  <rect x="60" y="66" width="130" height="6" rx="3" fill="url(#accent)"/>

  <!-- title -->
  <text x="60" y="130" fill="#f8fafc" font-size="46" font-weight="800" letter-spacing="0.5">APPROX-VLSI-ML</text>
  <text x="60" y="166" fill="#a5b4fc" font-size="19" font-weight="600">Python-Automated Design-Space Exploration for Approximate Arithmetic Circuits</text>
  <text x="60" y="194" fill="#64748b" font-size="15">RTL Generation&#160;&#8594;&#160;ML Surrogate Modeling&#160;&#8594;&#160;NSGA-II&#160;&#8594;&#160;OpenLane + SKY130 Silicon Validation</text>

  <!-- stat chips -->
  <g font-size="15" font-weight="700">
    <rect x="60" y="226" width="150" height="56" rx="10" fill="#0e1b33" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="135" y="251" text-anchor="middle" fill="#22d3ee" font-size="20">-36.16%</text>
    <text x="135" y="270" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">AREA</text>

    <rect x="222" y="226" width="150" height="56" rx="10" fill="#0e1b33" stroke="#818cf8" stroke-width="1.5"/>
    <text x="297" y="251" text-anchor="middle" fill="#818cf8" font-size="20">-75.10%</text>
    <text x="297" y="270" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">CRITICAL PATH</text>

    <rect x="384" y="226" width="150" height="56" rx="10" fill="#0e1b33" stroke="#f472b6" stroke-width="1.5"/>
    <text x="459" y="251" text-anchor="middle" fill="#f472b6" font-size="20">-64.34%</text>
    <text x="459" y="270" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">POWER</text>

    <rect x="546" y="226" width="170" height="56" rx="10" fill="#0e1b33" stroke="#34d399" stroke-width="1.5"/>
    <text x="631" y="251" text-anchor="middle" fill="#34d399" font-size="20">13/13 DRC·LVS</text>
    <text x="631" y="270" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">CLEAN ON SILICON</text>
  </g>
</svg>
