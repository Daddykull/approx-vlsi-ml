<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#15123a"/>
    </linearGradient>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="760" fill="url(#bgB)"/>
  <text x="550" y="46" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="800">System Block Diagram</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Module-level view of the approx-vlsi-ml pipeline</text>

  <!-- Group: Design Generation -->
  <rect x="40" y="100" width="300" height="150" rx="14" fill="#0e1b33" stroke="#22d3ee" stroke-width="2"/>
  <text x="190" y="124" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="800" letter-spacing="1">DESIGN GENERATION</text>
  <rect x="60" y="138" width="260" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="190" y="164" text-anchor="middle" fill="#e2e8f0" font-size="13">src/generator/adder_generator.py</text>
  <rect x="60" y="188" width="260" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="190" y="214" text-anchor="middle" fill="#e2e8f0" font-size="13">rtl/generated_adder.v</text>

  <!-- Group: Characterization -->
  <rect x="400" y="100" width="300" height="150" rx="14" fill="#0e1b33" stroke="#818cf8" stroke-width="2"/>
