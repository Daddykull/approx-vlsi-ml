  <text x="390" y="380" text-anchor="middle" fill="#e2e8f0" font-size="13">src/ml/train_models.py  (Random Forest)</text>
  <rect x="240" y="404" width="300" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="390" y="430" text-anchor="middle" fill="#e2e8f0" font-size="13">results/models/*.pkl  →  src/ml/predict.py</text>

  <!-- Group: Optimization -->
  <rect x="600" y="316" width="340" height="150" rx="14" fill="#0e1b33" stroke="#fbbf24" stroke-width="2"/>
  <text x="770" y="340" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="1">OPTIMIZATION LAYER</text>
  <rect x="620" y="354" width="300" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="770" y="380" text-anchor="middle" fill="#e2e8f0" font-size="13">src/optimization/pareto_search.py</text>
  <rect x="620" y="404" width="300" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="770" y="430" text-anchor="middle" fill="#e2e8f0" font-size="13">src/optimization/nsga2_search.py</text>

  <line x1="560" y1="391" x2="598" y2="391" stroke="#64748b" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- down arrow to physical -->
  <line x1="770" y1="466" x2="770" y2="500" stroke="#64748b" stroke-width="2"/>
  <line x1="770" y1="500" x2="550" y2="500" stroke="#64748b" stroke-width="2"/>
  <line x1="550" y1="500" x2="550" y2="528" stroke="#64748b" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Group: Physical implementation -->
  <rect x="300" y="531" width="500" height="110" rx="14" fill="#0e1b33" stroke="#f8fafc" stroke-width="2.5"/>
  <text x="550" y="556" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="800" letter-spacing="1">PHYSICAL IMPLEMENTATION LAYER</text>
  <rect x="320" y="568" width="460" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="550" y="594" text-anchor="middle" fill="#e2e8f0" font-size="13">OpenLane v1.0.2 + SKY130 (sky130_fd_sc_hd) — synth→DRC/LVS</text>
  <text x="550" y="628" text-anchor="middle" fill="#94a3b8" font-size="12">13 candidates in → 13 DRC/LVS-clean GDSII results out</text>

  <!-- down arrow to results -->
  <line x1="550" y1="641" x2="550" y2="676" stroke="#64748b" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Group: Results & Analysis -->
  <rect x="220" y="679" width="660" height="60" rx="14" fill="#0e1b33" stroke="#a78bfa" stroke-width="2"/>
  <text x="550" y="705" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="800" letter-spacing="1">RESULTS &amp; ANALYSIS LAYER</text>
  <text x="550" y="725" text-anchor="middle" fill="#94a3b8" font-size="12">results/physical_pareto/ · results/final/  —  PPA plots, Pareto curves, CSVs</text>
</svg>
