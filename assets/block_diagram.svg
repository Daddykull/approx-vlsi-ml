  <rect x="420" y="138" width="260" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="550" y="164" text-anchor="middle" fill="#e2e8f0" font-size="13">src/characterization/characterize.py</text>
  <rect x="420" y="188" width="260" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="550" y="214" text-anchor="middle" fill="#e2e8f0" font-size="13">Icarus Verilog (iverilog / vvp)</text>

  <!-- Group: Dataset -->
  <rect x="760" y="100" width="300" height="150" rx="14" fill="#0e1b33" stroke="#f472b6" stroke-width="2"/>
  <text x="910" y="124" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="800" letter-spacing="1">DATASET LAYER</text>
  <rect x="780" y="138" width="260" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="910" y="164" text-anchor="middle" fill="#e2e8f0" font-size="13">scripts/build_dataset.py</text>
  <rect x="780" y="188" width="260" height="42" rx="8" fill="#101c38" stroke="#334155"/>
  <text x="910" y="214" text-anchor="middle" fill="#e2e8f0" font-size="13">datasets/combined_dataset.csv (55 rows)</text>

  <!-- arrows row 1 -->
  <line x1="340" y1="175" x2="398" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="700" y1="175" x2="758" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- down arrow to ML -->
  <line x1="910" y1="250" x2="910" y2="285" stroke="#64748b" stroke-width="2"/>
  <line x1="910" y1="285" x2="550" y2="285" stroke="#64748b" stroke-width="2"/>
  <line x1="550" y1="285" x2="550" y2="313" stroke="#64748b" stroke-width="2" marker-end="url(#arrB)"/>

