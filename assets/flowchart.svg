<svg viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#15123a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="900" height="1500" fill="url(#bgF)"/>
  <text x="450" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="800">Pipeline Flowchart</text>
  <text x="450" y="76" text-anchor="middle" fill="#94a3b8" font-size="14">Design → Characterize → Learn → Optimize → Fabricate (virtually)</text>

  <!-- helper box template values -->
  <!-- Stage 1 -->
  <g>
    <rect x="300" y="110" width="300" height="70" rx="12" fill="#0e1b33" stroke="#22d3ee" stroke-width="2"/>
    <text x="450" y="138" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Parameter Configuration</text>
    <text x="450" y="160" text-anchor="middle" fill="#94a3b8" font-size="12">width, approx_bits (k), carry_truncation (t), correction_depth (c)</text>
  </g>
  <line x1="450" y1="180" x2="450" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="300" y="218" width="300" height="70" rx="12" fill="#0e1b33" stroke="#818cf8" stroke-width="2"/>
    <text x="450" y="246" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Python RTL Generator</text>
    <text x="450" y="268" text-anchor="middle" fill="#94a3b8" font-size="12">Jinja2-templated, parameterized Verilog</text>
  </g>
  <line x1="450" y1="288" x2="450" y2="323" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="300" y="326" width="300" height="70" rx="12" fill="#0e1b33" stroke="#818cf8" stroke-width="2"/>
    <text x="450" y="354" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Icarus Verilog Simulation</text>
    <text x="450" y="376" text-anchor="middle" fill="#94a3b8" font-size="12">Functional verification, randomized test vectors</text>
  </g>
  <line x1="450" y1="396" x2="450" y2="431" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g>
    <rect x="300" y="434" width="300" height="70" rx="12" fill="#0e1b33" stroke="#818cf8" stroke-width="2"/>
    <text x="450" y="462" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Characterization</text>
    <text x="450" y="484" text-anchor="middle" fill="#94a3b8" font-size="12">Error Rate, MED, NMED, logic-cell count</text>
  </g>
  <line x1="450" y1="504" x2="450" y2="539" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <g>
    <rect x="300" y="542" width="300" height="70" rx="12" fill="#0e1b33" stroke="#f472b6" stroke-width="2"/>
    <text x="450" y="570" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Combined Dataset</text>
    <text x="450" y="592" text-anchor="middle" fill="#94a3b8" font-size="12">55 valid design configurations</text>
  </g>
  <line x1="450" y1="612" x2="450" y2="647" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6 -->
  <g>
    <rect x="300" y="650" width="300" height="70" rx="12" fill="#0e1b33" stroke="#34d399" stroke-width="2"/>
    <text x="450" y="678" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Random Forest Models</text>
    <text x="450" y="700" text-anchor="middle" fill="#94a3b8" font-size="12">Error / MED / Cell-count surrogate models</text>
  </g>
  <line x1="450" y1="720" x2="450" y2="755" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 7 -->
  <g>
    <rect x="300" y="758" width="300" height="80" rx="12" fill="#0e1b33" stroke="#34d399" stroke-width="2"/>
    <text x="450" y="786" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Pareto Optimization</text>
    <text x="450" y="806" text-anchor="middle" fill="#94a3b8" font-size="12">Exhaustive search  +  NSGA-II</text>
    <text x="450" y="824" text-anchor="middle" fill="#64748b" font-size="11">cross-checked for agreement</text>
  </g>
  <line x1="450" y1="838" x2="450" y2="873" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 8 -->
  <g>
    <rect x="300" y="876" width="300" height="70" rx="12" fill="#0e1b33" stroke="#fbbf24" stroke-width="2"/>
    <text x="450" y="904" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">13 ML Pareto Candidates</text>
    <text x="450" y="926" text-anchor="middle" fill="#94a3b8" font-size="12">100% confirmed on the true logical Pareto front</text>
  </g>
  <line x1="450" y1="946" x2="450" y2="981" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowAccent)"/>

  <!-- Stage 9 -->
  <g>
    <rect x="270" y="984" width="360" height="90" rx="12" fill="#0e1b33" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="450" y="1014" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">OpenLane + SKY130</text>
    <text x="450" y="1036" text-anchor="middle" fill="#94a3b8" font-size="12">Synthesis → Floorplan → Place → CTS → Route</text>
    <text x="450" y="1056" text-anchor="middle" fill="#94a3b8" font-size="12">→ Extraction → Timing → DRC → LVS</text>
  </g>
  <line x1="450" y1="1074" x2="450" y2="1109" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Split into 3 outputs -->
  <line x1="450" y1="1109" x2="220" y2="1150" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="1109" x2="450" y2="1150" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="1109" x2="680" y2="1150" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="1150" x2="220" y2="1180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="1150" x2="450" y2="1180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="1150" x2="680" y2="1180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="120" y="1183" width="200" height="60" rx="10" fill="#0e1b33" stroke="#22d3ee" stroke-width="2"/>
    <text x="220" y="1211" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="800">AREA</text>
    <text x="220" y="1230" text-anchor="middle" fill="#94a3b8" font-size="11">-36.16%</text>
  </g>
  <g>
    <rect x="350" y="1183" width="200" height="60" rx="10" fill="#0e1b33" stroke="#818cf8" stroke-width="2"/>
    <text x="450" y="1211" text-anchor="middle" fill="#818cf8" font-size="16" font-weight="800">DELAY</text>
    <text x="450" y="1230" text-anchor="middle" fill="#94a3b8" font-size="11">-75.10%</text>
  </g>
  <g>
    <rect x="580" y="1183" width="200" height="60" rx="10" fill="#0e1b33" stroke="#f472b6" stroke-width="2"/>
    <text x="680" y="1211" text-anchor="middle" fill="#f472b6" font-size="16" font-weight="800">POWER</text>
    <text x="680" y="1230" text-anchor="middle" fill="#94a3b8" font-size="11">-64.34%</text>
  </g>

  <line x1="220" y1="1243" x2="450" y2="1285" stroke="#64748b" stroke-width="2"/>
  <line x1="680" y1="1243" x2="450" y2="1285" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="1243" x2="450" y2="1285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="260" y="1288" width="380" height="70" rx="12" fill="#0e1b33" stroke="#f8fafc" stroke-width="2"/>
    <text x="450" y="1318" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="800">Physical PPA Trade-offs</text>
    <text x="450" y="1340" text-anchor="middle" fill="#94a3b8" font-size="12">Error-rate vs. Area / Delay / Power curves</text>
  </g>

  <text x="450" y="1420" text-anchor="middle" fill="#475569" font-size="12">55 configs characterized · 20 true Pareto · 13 ML-selected · 13/13 DRC/LVS clean</text>
</svg>
